  <text x="852" y="218" class="skill">obsidian-memory</text><text x="852" y="236" class="role">日常检索 · 候选记忆 · 索引</text><text x="852" y="280" class="skill">obsidian-memory-cleanup</text><text x="852" y="298" class="role">显式清洗 · 去重合并 · 事实核查</text>
  <text x="852" y="342" class="skill">technical-cognition-framework</text><text x="852" y="360" class="role">概念 / 机制 / 方法 / 边界</text>
  <text x="670" y="406" class="skill">drawio-skill</text><text x="670" y="424" class="role">仅代码依赖关系图</text><text x="852" y="406" class="skill">excalidraw</text><text x="852" y="424" class="role">架构 / 流程 / 关系图</text>
  <text x="1034" y="406" class="skill">mindmap-builder</text><text x="1034" y="424" class="role">离线单文件 · 按需展开</text><text x="1034" y="478" class="skill skill-sm">mindmap-publisher</text><text x="1034" y="496" class="role">显式发布 · 必填路径前缀</text>
  <path d="M852 245 V266" class="handoff"/>
  <path d="M852 369 V391" class="handoff"/>
  <path d="M924 369 L1005 391" class="handoff"/><path d="M1034 434 V463" class="handoff"/>

  <text x="758" y="482" class="note">依赖图 / 通用图 / 思维导图按目标选用</text>

  <!-- AI Application Delivery -->
  <g filter="url(#shadow)"><rect x="1160" y="142" width="496" height="382" rx="16" fill="#fff" stroke="#efa100" stroke-width="2"/></g>
  <circle cx="1218" cy="174" r="20" fill="#efa100"/><text x="1218" y="175" class="badge">3</text>
  <text x="1252" y="183" class="section section-compact" fill="#df9300">AI 应用交付 AI Application Delivery</text>
  <g fill="#fff" stroke="#efa100" stroke-width="1.7">
    <rect x="1236" y="278" width="344" height="56" rx="8"/><rect x="1236" y="398" width="344" height="56" rx="8"/>
  </g>
  <text x="1408" y="299" class="skill">dify-dsl-app-builder</text><text x="1408" y="317" class="role">需求 → 本地 DSL · 静态验证</text><text x="1408" y="419" class="skill">dify-console-admin-api</text><text x="1408" y="437" class="role">远端创建 / 导入 / 导出 / 确认</text>
  <path d="M1408 334 V397" class="handoff"/><text x="1500" y="367" class="note">仅远端交付时</text>

  <!-- Engineering Operations -->
  <g filter="url(#shadow)"><rect x="24" y="548" width="520" height="250" rx="16" fill="#fff" stroke="#1473e6" stroke-width="2"/></g>
  <circle cx="82" cy="580" r="20" fill="#1473e6"/><text x="82" y="581" class="badge">4</text>
  <text x="116" y="589" class="section" fill="#1268cf">工程运维 Engineering Operations</text>
  <g fill="#fff" stroke="#1473e6" stroke-width="1.7">
    <rect x="44" y="630" width="230" height="50" rx="7"/><rect x="294" y="630" width="230" height="50" rx="7"/>
    <rect x="44" y="714" width="230" height="50" rx="7"/><rect x="294" y="714" width="230" height="50" rx="7"/>
  </g>
  <text x="159" y="648" class="skill">website-rebuild</text><text x="159" y="666" class="role">授权网站镜像与验证式重建</text>
  <text x="409" y="648" class="skill skill-sm"><tspan x="409" dy="-8">python-offline-</tspan><tspan x="409" dy="16">dependency-packager</tspan></text><text x="409" y="670" class="role">精确版本 + 目标 Python · 离线包</text>
  <text x="159" y="732" class="skill skill-sm">backend-log-contract-trace</text><text x="159" y="750" class="role">日志 → 代码与数据契约</text><text x="409" y="732" class="skill">python-db-query</text><text x="409" y="750" class="role">数据库 / MinIO · 默认只读</text>
  <path d="M274 739 H293" class="handoff"/>

  <!-- Market Intelligence -->
  <g filter="url(#shadow)"><rect x="568" y="548" width="568" height="250" rx="16" fill="#fff" stroke="#8b58c4" stroke-width="2"/></g>
  <circle cx="626" cy="580" r="20" fill="#8b58c4"/><text x="626" y="581" class="badge">5</text>
  <text x="660" y="589" class="section" fill="#7d4db3">市场洞察 Market Intelligence</text>
  <g fill="#fff" stroke="#8b58c4" stroke-width="1.7">
    <rect x="678" y="640" width="348" height="48" rx="7"/><rect x="678" y="724" width="348" height="48" rx="7"/>
  </g>
  <text x="852" y="657" class="skill">stock-analysis-system</text><text x="852" y="675" class="role">个股 / 小型观察列表 · 技术指标</text><text x="852" y="741" class="skill">us-sector-index-impact-report</text><text x="852" y="759" class="role">隔夜板块复盘 · 港股 / A 股影响</text>
  <text x="852" y="709" class="note">按研究目标选择 · 两条独立分析路径</text>

  <!-- Skill Governance -->
  <g filter="url(#shadow)"><rect x="1160" y="548" width="496" height="250" rx="16" fill="#fff" stroke="#559b54" stroke-width="2"/></g>
  <circle cx="1218" cy="580" r="20" fill="#559b54"/><text x="1218" y="581" class="badge">6</text>
  <text x="1252" y="589" class="section" fill="#4c8c4b">技能治理 Skill Governance</text>
  <rect x="1272" y="665" width="272" height="54" rx="8" fill="#fff" stroke="#559b54" stroke-width="1.7"/>
  <text x="1408" y="685" class="skill">skill-linter</text><text x="1408" y="703" class="role">结构 / 引用 / 元数据 / 路由检查</text>

  <!-- Cross-scenario governance -->
  <rect x="24" y="826" width="1632" height="88" rx="16" fill="#f8fcf8" stroke="#559b54" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="840" y="862" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#4c8c4b">跨场景质量检查 · 选择技能 → 阅读入口 → 按需加载参考 → 验证交付</text>
  <text x="840" y="892" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" fill="#173f72">25 个技能职责保持独立 · 连线不是强制步骤 · 发布与远端操作遵循各技能约定</text>
  <path d="M1408 798 V825" class="handoff"/>
</svg>
