<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="944" viewBox="0 0 1680 944">
  <title>Skills Manager · 25 个技能的职责与按需交接</title>
  <desc>六个业务场景。连线表示可选工作路径，不表示每次任务都必须依次执行；发布与远端操作遵循各技能的授权约定。</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d9e2ef" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14264b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#163e72"/>
    </marker>
    <style>
      .title{font:700 54px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0d315f}
      .subtitle{font:600 27px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#173f72}
      .section{font:700 24px 'Segoe UI','Microsoft YaHei',sans-serif}
      .section-compact{font-size:21px}
      .badge{font:700 27px 'Segoe UI',sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .skill{font:600 17px Consolas,'SFMono-Regular',monospace;fill:#132f55;text-anchor:middle;dominant-baseline:middle}
      .skill-sm{font-size:14px}
      .skill-xs{font-size:11.5px}
      .role{font:500 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#52677f;text-anchor:middle;dominant-baseline:middle}
      .note{font:500 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#52677f;text-anchor:middle}
      .legend{font:600 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#173f72}
      .flow{fill:none;stroke:#163e72;stroke-width:2;marker-end:url(#arrow)}
      .handoff{fill:none;stroke:#163e72;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1680" height="944" fill="#fbfcfe"/>
  <rect width="1680" height="944" fill="url(#dots)"/>

  <text x="80" y="68" class="title">Skills Manager · 工作场景全景图</text>
  <text x="82" y="112" class="subtitle">25 Skills · 6 Work Scenarios · 职责清晰 · 按需组合 · 参考资料按需加载</text>
  <g transform="translate(1330 24)">
    <rect width="324" height="96" rx="18" fill="#fff" stroke="#173f72" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M20 32 H88" class="flow"/>
    <text x="102" y="38" class="legend">实线：常用内容流</text>
    <path d="M20 67 H88" class="handoff"/>
    <text x="102" y="73" class="legend">虚线：按需调用 / 交接</text>
  </g>

  <!-- Content Operations -->
  <g filter="url(#shadow)">
    <rect x="24" y="142" width="520" height="382" rx="16" fill="#fff" stroke="#ff5f59" stroke-width="2"/>
  </g>
  <circle cx="82" cy="174" r="20" fill="#ff5f59"/><text x="82" y="175" class="badge">1</text>
  <text x="116" y="183" class="section" fill="#f0524d">内容生产 Content Operations</text>
  <g fill="#fff" stroke="#ff5f59" stroke-width="1.7">
    <rect x="44" y="205" width="232" height="42" rx="7"/><rect x="44" y="260" width="232" height="42" rx="7"/>
    <rect x="44" y="315" width="232" height="42" rx="7"/><rect x="44" y="370" width="232" height="42" rx="7"/>
    <rect x="44" y="455" width="232" height="42" rx="7"/>
    <rect x="296" y="205" width="228" height="42" rx="7"/><rect x="296" y="260" width="228" height="42" rx="7"/>
    <rect x="296" y="370" width="228" height="42" rx="7"/><rect x="296" y="455" width="228" height="42" rx="7"/>
  </g>
  <text x="160" y="219" class="skill">video-transcriber</text><text x="160" y="237" class="role">字幕优先 · 音视频转写</text>
  <text x="160" y="274" class="skill skill-xs">technical-source-to-public-article</text><text x="160" y="292" class="role">技术来源成文 · 主张可追溯</text>
  <text x="160" y="329" class="skill skill-sm">technical-article-polisher</text><text x="160" y="347" class="role">术语与表达 · 保留作者原意</text>
  <text x="160" y="384" class="skill skill-xs">technical-article-visual-director</text><text x="160" y="402" class="role">配图规划 / 生成 · 图注与落位</text>
  <text x="160" y="469" class="skill">wechat-format</text><text x="160" y="487" class="role">公众号 HTML · 保留已审稿</text>
  <text x="410" y="219" class="skill">office-cli-skill</text><text x="410" y="237" class="role">DOCX / XLSX / PPTX 操作</text>
  <text x="410" y="274" class="skill">official-format-pro</text><text x="410" y="292" class="role">党政公文 DOCX 排版</text>
  <text x="410" y="384" class="skill skill-xs">wechat-history-article-archive</text><text x="410" y="402" class="role">授权文章归档 · 本地图片</text>
  <text x="410" y="469" class="skill">wechat-cover</text><text x="410" y="487" class="role">封面生成 · 按需插入副本</text>
  <path d="M160 247 V259" class="flow"/><path d="M160 302 V314" class="handoff"/><path d="M160 357 V369" class="handoff"/>
  <path d="M160 412 V454" class="flow"/>
  <path d="M410 412 C410 438 285 430 275 455" class="handoff"/><path d="M296 476 H277" class="handoff"/>

  <!-- Knowledge Visualization -->
  <g filter="url(#shadow)"><rect x="568" y="142" width="568" height="382" rx="16" fill="#fff" stroke="#18a6b8" stroke-width="2"/></g>
  <circle cx="626" cy="174" r="20" fill="#18a6b8"/><text x="626" y="175" class="badge">2</text>
  <text x="660" y="183" class="section section-compact" fill="#1497aa">知识构建与可视化 Knowledge Visualization</text>
  <g fill="#fff" stroke="#18a6b8" stroke-width="1.7">
    <rect x="684" y="205" width="336" height="40" rx="7"/><rect x="684" y="267" width="336" height="40" rx="7"/>
    <rect x="684" y="329" width="336" height="40" rx="7"/>
    <rect x="590" y="392" width="160" height="42" rx="7"/><rect x="772" y="392" width="160" height="42" rx="7"/>
    <rect x="954" y="392" width="160" height="42" rx="7"/><rect x="954" y="464" width="160" height="42" rx="7"/>
